<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; 'unsafe-inline'">-->
    <title>时光信笺</title>
    <!-- 必须在任何 CSS 之前 -->
    <script>
        (function () {
            if (window?.localStorage) {
                let projectSettings = {};
                try {
                    projectSettings = JSON.parse(localStorage.getItem('projectSettings')) || {};
                } catch (e) { /* empty */ }
                const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                const theme = projectSettings.appearance?.theme
                if (theme) {
                    const finalTheme = theme === 'system' ? (prefersLight ? 'light' : 'dark') : theme;
                    if (finalTheme === 'dark') {
                        document.documentElement.setAttribute('dark-theme', '')
                    }
                }
                // 界面语言：跟随系统时按浏览器语言解析（zh* → 中文）
                const language = projectSettings.locale?.language;
                if (language === 'en' || (language === 'system' && !/^zh/i.test(navigator.language || ''))) {
                    document.documentElement.lang = 'en';
                } else {
                    document.documentElement.lang = 'zh-CN';
                }
            }
        })();
    </script>
    <!-- 主题关键样式 -->
    <link rel="stylesheet" href="src/assets/styles/theme.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
