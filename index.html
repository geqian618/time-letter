<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; 'unsafe-inline'">-->
    <title>时光信笺</title>
    <!-- 必须在任何 CSS 之前 -->
    <script>
        (function () {
            if (window?.localStorage) {
                const json = localStorage.getItem('projectSettings');
                const projectSettings = JSON.parse(json) || {};
                const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                const theme = projectSettings.appearance?.theme
                if (theme) {
                    const finalTheme = theme === 'system' ? (prefersLight ? 'light' : 'dark') : theme;
                    if (finalTheme === 'dark') {
                        document.documentElement.setAttribute('dark-theme', '')
                    }
                }
            }
        })();
    </script>
    <!-- 主题关键样式 -->
    <link rel="stylesheet" href="src/assets/styles/theme.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
