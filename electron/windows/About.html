<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>关于</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .layout {
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .content {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
        }

        .app-desc {
            width: 100%;
            height: 40px;
        }

        .extend {
            width: 100%;
            height: calc(100% - 80px);
        }

        .contact {
            margin-top: 20px;
        }

        .author {
            height: 20px;
            width: 100%;
        }


        img {
            border: 1px solid #e3e0e0;
            height: 220px;
            width: 200px;
            vertical-align: top;
        }


    </style>
</head>
<body>
<div class="layout">
    <div class="content">
        <div class="app-desc">简介：“时光信笺”是一款简易、灵活性高、扩展性极强的照片水印、边框绘制工具</div>
        <div class="extend">
            <div class="contact">
                <span>联系与赞赏作者：</span>
                <img src="../resources/二维码.jpg">
                <img src="../resources/赞赏码.jpg">
            </div>
        </div>
        <div class="author">作者：秋风吹落了秋枫</div>
    </div>
</div>
</body>
</html>
