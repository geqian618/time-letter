# 多平台打包：electron:build 中的 bytenode 编译产物（.jsc 字节码）与构建机的
# Electron V8 版本、CPU 架构绑定，不保证跨平台/跨架构可用，
# 因此 Windows / Linux / macOS 安装包必须在对应系统上分别构建（本工作流即官方产物来源）。
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: win-x64
          - os: ubuntu-latest
            name: linux-x64
          # bytenode 字节码与 CPU 架构绑定，mac 双架构必须在对应架构的 runner 上分别构建
          - os: macos-13
            name: mac-x64
          - os: macos-latest
            name: mac-arm64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 各平台的原生依赖（sharp / exiftool-vendored / electron 二进制）按当前系统安装
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build & Package
        run: npm run electron:build
        env:
          # 无签名证书：跳过 macOS codesign 探测与 Windows 证书查找
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-letter-${{ matrix.name }}
          if-no-files-found: error
          path: |
            output/*.exe
            output/*.zip
            output/*.AppImage
            output/*.tar.gz
            output/*.dmg
            output/*.blockmap

  # 推送 v* tag 时：汇总四平台产物，创建 GitHub Release（草稿状态，人工确认后发布）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
